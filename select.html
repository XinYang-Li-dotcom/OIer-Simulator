<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OIer模拟器 · 选人</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-wrapper">
        <header>
            <div class="header-left">
                <span class="title">🧑‍💻 OIer模拟器</span>
                <span class="diff-badge">选人阶段</span>
            </div>
            <div class="stat-group">
                <span style="font-size:.85em; color:var(--text-muted);">从12人中选出6人</span>
                <span id="selected-count" style="font-weight:bold; color:var(--btn-accent);">已选 0/6</span>
            </div>
        </header>

        <div class="app-body" style="grid-template-columns:1fr; padding:20px;">
            <div class="main-view" style="border:none; box-shadow:none; padding:0;">
                <div class="view-header">
                    <h3>👥 候选选手 (点击选择/取消)</h3>
                    <button id="btn-start-game" class="chart-toggle-btn" style="background:var(--btn-success);" disabled>🚀 开始集训</button>
                </div>
                <div class="stu-grid" id="candidate-grid"></div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="player.js"></script>
    <script>
        // ===== 工具函数 =====
        function getLevel(score, cap) {
            const r = score / cap;
            if (r >= 0.95) return { level: 'SSS', color: '#dc2626' };
            if (r >= 0.88) return { level: 'SS', color: '#ea580c' };
            if (r >= 0.80) return { level: 'S', color: '#9333ea' };
            if (r >= 0.70) return { level: 'A', color: '#16a34a' };
            if (r >= 0.55) return { level: 'B', color: '#2563eb' };
            if (r >= 0.40) return { level: 'C', color: '#64748b' };
            if (r >= 0.25) return { level: 'D', color: '#94a3b8' };
            return { level: 'E', color: '#cbd5e1' };
        }
        function getNormalEfficiency(score, cap) {
            const ratio = score / cap;
            let eff;
            if (ratio < 0.25) eff = 2.0 - (ratio / 0.25) * 0.2;
            else if (ratio < 0.40) eff = 1.8 - ((ratio - 0.25) / 0.15) * 0.3;
            else if (ratio < 0.55) eff = 1.5 - ((ratio - 0.40) / 0.15) * 0.5;
            else if (ratio < 0.70) eff = 1.0 - ((ratio - 0.55) / 0.15) * 0.4;
            else if (ratio < 0.85) eff = 0.6 - ((ratio - 0.70) / 0.15) * 0.3;
            else eff = 0.3 * Math.exp(-6 * (ratio - 0.85));
            return Math.max(0.02, Math.min(2.0, eff));
        }

        // 新的 OI 等级评定（0-1000）
        function getLevelOI(score) {
            // 边界情况
            if (score >= 950) return { level: 'SSS', color: '#dc2626' };
            if (score >= 900) return { level: 'SS+', color: '#ea580c' };
            if (score >= 800) return { level: 'SS', color: '#9333ea' };
            if (score >= 700) return { level: 'S', color: '#16a34a' };
            if (score >= 600) return { level: 'A+', color: '#2563eb' };
            if (score >= 500) return { level: 'A', color: '#3b82f6' };
            if (score >= 400) return { level: 'B', color: '#64748b' };
            if (score >= 300) return { level: 'C', color: '#94a3b8' };
            if (score >= 200) return { level: 'D', color: '#cbd5e1' };
            if (score >= 100) return { level: 'E', color: '#9ca3af' };
            return { level: 'F', color: '#e5e7eb' };
        }

        // ===== 选人逻辑 =====
        let candidates = [];
        let selected = [];
        // 每个卡片的显示模式：存储为数组，默认 'whk'
        let cardModes = [];

        function generateCandidates() {
            const names = ['Tourist', 'jiangly', 'Petr', 'Elegia', 'mnbvmar', 'ecnerwala',
                           'Um_nik', 'Benq', 'neal', 'scott_wu', 'apiad', 'Endagorion'];
            candidates = names.map(name => createPlayer(name));
            // 打乱
            for (let i = candidates.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
            }
            // 初始化每个卡片的模式为 'whk'
            cardModes = candidates.map(() => 'whk');
            renderCandidates();
        }

        function toggleCardMode(idx) {
            // 切换该卡片的模式
            cardModes[idx] = cardModes[idx] === 'whk' ? 'oi' : 'whk';
            renderCandidates();
        }

        function renderCandidates() {
            const grid = document.getElementById('candidate-grid');
            grid.innerHTML = candidates.map((p, idx) => {
                const isSelected = selected.includes(idx);
                const mode = cardModes[idx] || 'whk'; // 默认 whk

                // 特质标签
                const talentTags = p.talents.map(t => {
                    const cls = t.t === 'pos' ? 'tag-pos' : 'tag-neg';
                    return `<span class="tag ${cls}" title="${t.d}">${t.n}</span>`;
                }).join('');

                // 根据模式渲染科目
                let subHtml = '';
                if (mode === 'whk') {
                    const subjects = CONFIG.CULTURE_SUBJECTS;
                    const names = CONFIG.CULTURE_NAMES;
                    subHtml = subjects.map(sub => {
                        const val = p.culture[sub];
                        const lv = getLevel(val, 150);
                        return `<div class="sub-box">
                            <div class="sub-label">${names[sub]}</div>
                            <div class="sub-val" style="color:${lv.color};">${lv.level}</div>
                            <div class="sub-estimate">${Math.round(val)}</div>
                            <div class="sub-eff">${Math.round(getNormalEfficiency(val, 150)*100)}%</div>
                        </div>`;
                    }).join('');
                } else {
                    const subjects = CONFIG.OI_SUBJECTS;
                    const names = CONFIG.OI_NAMES;
                    subHtml = subjects.map(sub => {
                        const val = p.oi[sub];
                        const lv = getLevelOI(val);
                        return `<div class="sub-box">
                            <div class="sub-label">${names[sub]}</div>
                            <div class="sub-val" style="color:${lv.color};">${lv.level}</div>
                            <div class="sub-estimate">${Math.round(val)}</div>
                            <div class="sub-eff" style="font-size:.5em;">&nbsp;</div>
                        </div>`;
                    }).join('');
                }

                // 底部信息：WHK显示文理效率，OI显示思维/代码
                let bottomHtml = '';
                if (mode === 'whk') {
                    bottomHtml = `<div class="eff-row">
                        <span>📖 文科 ${Math.round((p.effArts - 0.5) * 100)}%</span>
                        <span>🔬 理科 ${Math.round((p.effSci - 0.5) * 100)}%</span>
                    </div>`;
                } else {
                    bottomHtml = `<div class="eff-row">
                        <span>🧠 思维 ${p.thinking}</span>
                        <span>💻 代码 ${p.coding}</span>
                    </div>`;
                }

                const naughtyStr = `🎭 ${Math.round(p.naughty * 100)}%`;

                // 右上角切换按钮：显示当前模式，点击切换
                const modeLabel = mode === 'whk' ? '📚' : '💻';
                const modeTitle = mode === 'whk' ? '切换 OI' : '切换 WHK';

                return `
                    <div class="stu-card ${isSelected ? 'selected-card' : ''}" 
                         style="cursor:pointer; border:2px solid ${isSelected ? 'var(--btn-success)' : 'var(--border-color)'};"
                         onclick="toggleSelect(${idx})">
                        <div class="stu-header">
                            <span class="stu-name">${p.name} <span style="font-size:.7em;color:var(--text-muted);font-weight:normal;">${naughtyStr}</span></span>
                            <span style="display:flex; gap:6px; align-items:center;">
                                <span class="stu-label" style="font-size:.7em;">${mode === 'whk' ? '文化' : 'OI'}</span>
                                <button class="btn-mini" style="font-size:.65em; padding:2px 8px;" 
                                        onclick="event.stopPropagation(); toggleCardMode(${idx});" 
                                        title="${modeTitle}">${modeLabel}</button>
                            </span>
                        </div>
                        <div class="tag-pool">${talentTags}</div>
                        <div class="sub-grid">${subHtml}</div>
                        ${bottomHtml}
                    </div>
                `;
            }).join('');
            document.getElementById('selected-count').textContent = `已选 ${selected.length}/6`;
            document.getElementById('btn-start-game').disabled = selected.length !== 6;
        }

        function toggleSelect(idx) {
            const pos = selected.indexOf(idx);
            if (pos >= 0) {
                selected.splice(pos, 1);
            } else if (selected.length < 6) {
                selected.push(idx);
            } else {
                alert('最多选择6人');
                return;
            }
            renderCandidates();
        }

        document.getElementById('btn-start-game').addEventListener('click', function() {
            if (selected.length !== 6) return;
            const chosen = selected.map(idx => candidates[idx]);
            localStorage.setItem('oi_players', JSON.stringify(chosen));
            window.location.href = 'main.html';
        });

        window.onload = generateCandidates;
    </script>
</body>
</html>
